id: bash-long
title: "Bash — long command with wrapping"
fixture: bash-long.json

expect:
  card_kind: regular
  width_pt: 340
  tool_pill:
    text: "BASH"
    color: orange
  session_tag:
    visible: true
    contains: "structure"
  command_block:
    visible: true
    prefix: "$"
    contains: "find ."
    truncated: false
    wrapped: true
  title_text: "Permission Request"
  buttons:
    - { label: "Deny",  hint: "⌘⇧N", style: secondary }
    - { label: "Allow", hint: "⌘⇧Y", style: primary }
  allow_session_button: false
  suggestions: []

notes: |
  Long command wraps across multiple lines within CommandBlock (lineLimit 8, no ellipsis).
  The cwd folder label shows the last path component "structure".
