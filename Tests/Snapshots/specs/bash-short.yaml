id: bash-short
title: "Bash — short command, no suggestions"
fixture: bash-short.json

expect:
  card_kind: regular
  width_pt: 340
  tool_pill:
    text: "BASH"
    color: orange
  session_tag:
    visible: true
    contains: "myrepo"
  command_block:
    visible: true
    prefix: "$"
    contains: "ls -la"
    truncated: false
  title_text: "Permission Request"
  buttons:
    - { label: "Deny",  hint: "⌘⇧N", style: secondary }
    - { label: "Allow", hint: "⌘⇧Y", style: primary }
  allow_session_button: false
  suggestions: []

notes: |
  Single-line command. CommandBlock shows "$ ls -la" with no truncation.
  "Allow Session" button should not appear (no suggestions, regular permission).
  Session tag shows "myrepo · #xyz" from cwd + session_id suffix.
